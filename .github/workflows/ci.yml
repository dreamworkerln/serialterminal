name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src serialterminal.py tools

      - name: Static analysis
        run: ruff check src tests serialterminal.py tools

      - name: Complexity
        continue-on-error: true
        run: lizard -l python -C 10 -L 80 -a 5 src serialterminal.py tools

      - name: Tests
        run: pytest -q
