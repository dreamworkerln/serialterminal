[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serialterminal"
version = "0.2.0"
description = "Line-oriented terminal with Serial Port and BLE transports"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = ["pytest>=8"]

[project.scripts]
serialterminal = "serialterminal.cli:main"
serialterm = "serialterminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
