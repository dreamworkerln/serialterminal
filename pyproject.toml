[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serialterminal"
version = "0.4.1"
description = "Line-oriented terminal with sticky USB, BLE NUS, and Bluetooth SPP transports"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "pyserial>=3.5",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "lizard>=1.17",
]

[project.scripts]
serialterminal = "serialterminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
